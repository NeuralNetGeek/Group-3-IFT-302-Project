<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard - Day Mode (°C)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER SECTION -->
  <header class="top-bar">
    <h1 class="location">Abuja, NG</h1>
    <p class="local-time">07:30 AM (Updated)</p>
  </header>

  <!-- MAIN WEATHER SECTION -->
  <main class="main-weather">
    <div class="temperature">
      <h2 class="temp">24°C</h2>
      <p class="feels-like">Feels like 27°C</p>
      <p class="condition">Scattered Clouds</p>
    </div>
  </main>

  <!-- WEATHER DETAILS SECTION -->
  <section class="weather-details">
    <div class="detail">
      <p>Humidity</p>
      <h3>78%</h3>
    </div>
    <div class="detail">
      <p>Pressure</p>
      <h3>1012 hPa</h3>
    </div>
    <div class="detail">
      <p>Wind Speed</p>
      <h3>4.2 m/s</h3>
    </div>
    <div class="detail">
      <p>Visibility</p>
      <h3>9 km</h3>
    </div>
  </section>

  <!-- 5-DAY FORECAST -->
  <section class="forecast">
    <div class="forecast-card">
      <p>Tue</p>
      <img src="assets/icons/cloudy.svg" alt="cloudy icon">
      <p>24°C / 30°C</p>
    </div>
    <div class="forecast-card">
      <p>Wed</p>
      <img src="assets/icons/rain.svg" alt="rain icon">
      <p>22°C / 28°C</p>
    </div>
    <div class="forecast-card">
      <p>Thu</p>
      <img src="assets/icons/sun.svg" alt="sunny icon">
      <p>25°C / 33°C</p>
    </div>
    <div class="forecast-card">
      <p>Fri</p>
      <img src="assets/icons/thunder.svg" alt="thunder icon">
      <p>23°C / 31°C</p>
    </div>
    <div class="forecast-card">
      <p>Sat</p>
      <img src="assets/icons/clear.svg" alt="clear sky icon">
      <p>24°C / 32°C</p>
    </div>
  </section>
</body>
</html>
