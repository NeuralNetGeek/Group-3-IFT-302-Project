<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div class="day-celsius">
      <!-- SEARCH BAR -->
      <div id="search-bar" class="search-bar">
        <input id="search-input" type="text" placeholder="Search city..." />
      </div>

      <!-- WEATHER MAIN CARD -->
      <div class="frame">
        <div class="div"></div>
        <div class="frame-2">
          <div class="frame-3">
            <div class="frame-4">
              <div id="city" class="text-wrapper">Abuja</div>
              <div id="country" class="text-wrapper-2">NG</div>
              <div class="text-wrapper-3">,</div>
            </div>
            <div class="frame-5">
              <img id="weather-icon" class="vector" src="img/vector-7.svg" />
            </div>
          </div>

          <div class="frame-wrapper">
            <div class="frame-6">
              <div class="div-wrapper">
                <div class="vector-wrapper">
                  <img class="vector-2" src="img/vector-3.svg" />
                </div>
              </div>
              <div class="scattered-clouds-wrapper">
                <div id="condition" class="scattered-clouds">Scattered Clouds</div>
              </div>
            </div>
          </div>

          <div class="frame-7">
            <div id="updated-time" class="text-wrapper-4">07:30 AM</div>
            <div class="text-wrapper-5">Updated</div>
          </div>
        </div>
      </div>

      <!-- WEATHER METRICS -->
      <div class="frame-8">
        <div class="frame-9">
          <div class="frame-10">
            <img class="frame-11" src="img/frame-2.svg" />
            <div class="frame-12"><div class="text-wrapper-6">Humidity</div></div>
          </div>
          <div class="frame-13">
            <div class="frame-14"><div class="text-wrapper-7">%</div></div>
            <div id="humidity" class="frame-15"><div class="text-wrapper-8">78</div></div>
          </div>
        </div>

        <div class="frame-16">
          <div class="rectangle"></div>
          <div class="frame-17">
            <img class="frame-11" src="img/frame-4.svg" />
            <div class="frame-18"><div class="text-wrapper-9">Pressure</div></div>
          </div>
          <div class="frame-19">
            <div class="frame-20"><div class="text-wrapper-10">hPa</div></div>
            <div id="pressure" class="frame-21"><div class="text-wrapper-11">1012</div></div>
          </div>
        </div>

        <div class="frame-22">
          <div class="frame-10">
            <img class="frame-11" src="img/image.svg" />
            <div class="frame-23"><div class="text-wrapper-12">Wind Speed</div></div>
          </div>
          <div class="frame-13">
            <div class="frame-24"><div class="text-wrapper-10">m/s</div></div>
            <div id="wind" class="frame-25"><div class="text-wrapper-13">4.2</div></div>
          </div>
        </div>

        <div class="frame-26">
          <div class="rectangle"></div>
          <div class="frame-17">
            <img class="frame-11" src="img/frame-3.svg" />
            <div class="frame-27"><div class="text-wrapper-14">Visibility</div></div>
          </div>
          <div class="frame-19">
            <div class="frame-28"><div class="text-wrapper-15">km</div></div>
            <div id="visibility" class="frame-29"><div class="text-wrapper-16">9</div></div>
          </div>
        </div>
      </div>

      <!-- TEMPERATURE SECTION -->
      <div class="frame-31">
        <div class="frame-32">
          <div id="feels-like" class="text-wrapper-17">27</div>
          <div class="text-wrapper-18">Feels like</div>
          <div class="text-wrapper-19">°C</div>
        </div>
        <div class="frame-33">
          <div class="text-wrapper-20">°C</div>
          <div id="temperature" class="text-wrapper-21">28</div>
        </div>
      </div>

      <!-- TOGGLE -->
      <div class="frame-34">
        <div id="celsius-btn" class="frame-35"><div class="text-wrapper-22">°C</div></div>
        <div id="fahrenheit-btn" class="frame-36"><div class="text-wrapper-23">°F</div></div>
      </div>

      <!-- NAVIGATION SIDE -->
      <div class="frame-37">
        <div class="rectangle-2"></div>
        <div class="frame-38">
          <div class="frame-39">
            <div class="frame-40">
              <div class="frame-41">
                <div class="img-wrapper"><img class="vector-2" src="img/vector-6.svg" /></div>
              </div>
              <div class="frame-42">
                <div class="frame-43"><div class="text-wrapper-24">Dashboard</div></div>
                <div class="frame-44"><div class="text-wrapper-25">Weather</div></div>
              </div>
            </div>
          </div>

          <div class="frame-45">
            <div class="frame-46">
              <div class="frame-47"><div class="text-wrapper-26">Current Location</div></div>
              <div class="frame-48">
                <img class="vector" src="img/vector-2.svg" />
                <img class="img" src="img/vector.svg" />
              </div>
            </div>
            <div class="frame-49"><div class="text-wrapper-27">Abuja</div></div>
          </div>

          <div class="frame-50">
            <div class="frame-46">
              <div class="frame-48"><img class="vector-2" src="img/vector-4.svg" /></div>
              <div class="frame-51"><div class="text-wrapper-28">Condition</div></div>
            </div>
            <div class="frame-49"><div id="side-condition" class="text-wrapper-29">Clear</div></div>
          </div>

          <div class="frame-52">
            <div class="frame-46">
              <div class="frame-53"><div class="text-wrapper-30">Local Time</div></div>
              <div class="frame-54">
                <img class="vector-3" src="img/vector-9.svg" />
                <img class="vector-4" src="img/vector-8.svg" />
              </div>
            </div>
            <div class="frame-55"><div id="local-time" class="text-wrapper-31">07:30 AM</div></div>
          </div>
        </div>
      </div>

      <!-- FORECAST SECTION -->
      <section id="forecast" class="forecast-section"></section>
    </div>
  </body>
</html>
